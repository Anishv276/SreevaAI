[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:eval_worker]
command=python -m interview.eval_worker
directory=/app
autostart=true
autorestart=true          ; restart automatically on any crash or exit
startretries=999          ; keep retrying forever in prod
stopwaitsecs=10
stderr_logfile=/var/log/eval_worker.err.log
stdout_logfile=/var/log/eval_worker.out.log
environment=PYTHONUNBUFFERED="1"

[program:agent]
command=python agent.py start
directory=/app
autostart=true
autorestart=true
startretries=999
stopwaitsecs=10
stderr_logfile=/var/log/agent.err.log
stdout_logfile=/var/log/agent.out.log
environment=PYTHONUNBUFFERED="1"