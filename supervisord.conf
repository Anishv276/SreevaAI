[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:agent]
command=python agent.py start
directory=/app
user=root
autostart=true
autorestart=true
startretries=999
stopwaitsecs=10
stderr_logfile=/var/log/agent.err.log
stdout_logfile=/var/log/agent.out.log
environment=PYTHONUNBUFFERED="1"
