# =============================================================================
# SreevaAI — Production stack for a single EC2 box (Phase 1, SELF-HOSTED LiveKit)
#
# Everything runs on ONE box: traefik (TLS) + redis + app + worker + python
# agent + LiveKit media server + LiveKit egress (recording).
#
# vs your original docker-compose.yml:
#   - Self-contained `traefik` (no pre-existing external network needed).
#   - Local `redis` container shared by BullMQ AND LiveKit/egress (one Redis).
#   - App image built once (`sreeva-app`) and reused by the worker.
#   - Secrets/keys come from .env (LIVEKIT_API_KEY / LIVEKIT_API_SECRET etc.)
#
# AWS security group MUST allow:  80/tcp 443/tcp  +  7881/tcp  +  5000-5100/udp
#
# Bring up:  docker compose -f docker-compose.prod.yml up -d --build
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Reverse proxy + automatic TLS for www/apex AND lk.sreevaai.com
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v3.1
    container_name: traefik
    restart: always
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.mytlschallenge.acme.tlschallenge=true"
      - "--certificatesresolvers.mytlschallenge.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.mytlschallenge.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "letsencrypt:/letsencrypt"
    networks:
      - web

  # ---------------------------------------------------------------------------
  # Redis — BullMQ queues + LiveKit/egress coordination (single shared instance)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    networks:
      - web

  # ---------------------------------------------------------------------------
  # Next.js app + API
  # ---------------------------------------------------------------------------
  hr-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL}   # wss://lk.sreevaai.com
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    image: sreeva-app:latest
    container_name: Frontend
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
      LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL}        # server-side token minting
      NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL}
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
      - livekit
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hr-app.rule=Host(`www.sreevaai.com`) || Host(`sreevaai.com`)"
      - "traefik.http.routers.hr-app.entrypoints=websecure"
      - "traefik.http.routers.hr-app.tls=true"
      - "traefik.http.routers.hr-app.tls.certresolver=mytlschallenge"
      - "traefik.http.services.hr-app.loadbalancer.server.port=3000"

  # ---------------------------------------------------------------------------
  # Background worker — all BullMQ queues
  # ---------------------------------------------------------------------------
  hr-worker:
    image: sreeva-app:latest
    container_name: Normal-worker
    restart: always
    command: ["npm", "exec", "--", "tsx", "worker.ts"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL}
      NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL}
      REDIS_URL: redis://redis:6379
      WORKER_QUEUES: "resume-processing,invitation-delivery-queue,interview-start,interview-finalization,interview-snapshots,interview-recording,recording-retention-cleanup,jd-upload,jd-extraction,backup-queue"
    depends_on:
      - redis
      - hr-frontend
    networks:
      - web

  # ---------------------------------------------------------------------------
  # Python LiveKit AI agent — connects to the local LiveKit over the docker net
  # ---------------------------------------------------------------------------
  hr-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: Backend-python-agent
    restart: always
    env_file:
      - .env
    environment:
      LIVEKIT_URL: "ws://livekit:7880"      # internal — no round trip to the edge
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
      - livekit
    networks:
      - web

  # ---------------------------------------------------------------------------
  # LiveKit media server (self-hosted)
  #   - 7880 stays internal; Traefik terminates TLS for wss://lk.sreevaai.com
  #   - 7881/tcp + 5000-5100/udp are published to the host for WebRTC media
  #   - use_external_ip:true -> advertises the box's Elastic IP to clients
  # ---------------------------------------------------------------------------
  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit
    restart: always
    networks:
      - web
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses:
          - ""
        rtc:
          tcp_port: 7881
          port_range_start: 5000
          port_range_end: 5100
          use_external_ip: true
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
        redis:
          address: "redis:6379"
        logging:
          level: info
    ports:
      - "7881:7881"
      - "5000-5100:5000-5100/udp"
    depends_on:
      - redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.livekit.rule=Host(`lk.sreevaai.com`)"
      - "traefik.http.routers.livekit.entrypoints=websecure"
      - "traefik.http.routers.livekit.tls=true"
      - "traefik.http.routers.livekit.tls.certresolver=mytlschallenge"
      - "traefik.http.services.livekit.loadbalancer.server.port=7880"

  # ---------------------------------------------------------------------------
  # LiveKit Egress (recording) — uploads composites to R2. CPU-heavy.
  # ---------------------------------------------------------------------------
  livekit-egress:
    image: livekit/egress:latest
    container_name: livekit-egress
    restart: always
    networks:
      - web
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: "${LIVEKIT_API_KEY}"
        api_secret: "${LIVEKIT_API_SECRET}"
        ws_url: "ws://livekit:7880"
        redis:
          address: "redis:6379"
        cpu_cost:
          room_composite_cpu_cost: 2.0
          web_cpu_cost: 2.0
          track_composite_cpu_cost: 1.0
          track_cpu_cost: 0.5
    depends_on:
      - livekit
      - redis

networks:
  web:
    driver: bridge

volumes:
  redis-data:
  letsencrypt:
