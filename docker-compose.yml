services:
  # Next.js Frontend + API
  hr-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # NEXT_PUBLIC_LIVEKIT_URL: "wss://new-wi7dgqfb.livekit.cloud" # LiveKit Cloud (commented for now)
        NEXT_PUBLIC_LIVEKIT_URL: "wss://lk.sreevaai.com" # Deployment cloud
        NEXT_PUBLIC_APP_URL: "https://www.sreevaai.com"
    container_name: Frontend
    networks:
      - traefik-proxy
    env_file:
      - .env
    environment:
      LIVEKIT_URL: "wss://lk.sreevaai.com"
      NEXT_PUBLIC_LIVEKIT_URL: "wss://lk.sreevaai.com"
      REDIS_URL: "redis://redis:6379"
    restart: always
    dns:
      - 8.8.8.8
      - 8.8.4.4
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hr-app.rule=Host(`www.sreevaai.com`) || Host(`sreevaai.com`)"
      - "traefik.http.routers.hr-app.entrypoints=websecure"
      - "traefik.http.routers.hr-app.tls=true"
      - "traefik.http.routers.hr-app.tls.certresolver=mytlschallenge"
      - "traefik.http.services.hr-app.loadbalancer.server.port=3000"
    depends_on:
      redis:
        condition: service_healthy

  # Background Worker (Handles Scoring & Emails)
  hr-worker:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: Normal-worker
    command: ["npm", "exec", "--", "tsx", "worker.ts"]
    env_file:
      - .env
    environment:
      LIVEKIT_URL: "wss://lk.sreevaai.com"
      NEXT_PUBLIC_LIVEKIT_URL: "wss://lk.sreevaai.com"
      REDIS_URL: "redis://redis:6379"
      WORKER_QUEUES: "resume-processing,invitation-delivery-queue,interview-start,interview-finalization,interview-snapshots,interview-recording,recording-retention-cleanup,jd-upload,jd-extraction,backup-queue"
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - traefik-proxy
    dns:
      - 8.8.8.8
      - 8.8.4.4

  # Python AI Agent (Backend)
  hr-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: Backend-python-agent
    networks:
      - traefik-proxy
    env_file:
      - .env
    environment:
      LIVEKIT_URL: "ws://livekit:7880"
      REDIS_URL: "redis://redis:6379"
    restart: always
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      redis:
        condition: service_healthy

  # LiveKit Server (Self-Hosted)
  # Full config is supplied inline from .env via LIVEKIT_CONFIG (no hardcoded secrets, no mounted file).
  # Secrets (keys + redis) come from .env; static infra values (ports, log level) are fixed here.
  # Redis must match the egress service below so egress receives jobs.
  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit
    restart: always
    networks:
      - traefik-proxy
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses:
          - ""
        rtc:
          tcp_port: 7881
          port_range_start: 5000
          port_range_end: 5100
          use_external_ip: true
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
        redis:
          # Internal redis container runs without auth — no username/password.
          address: "redis:6379"
        logging:
          level: debug
    ports:
      - "5000-5100:5000-5100/udp"
      - "7880:7880"
      - "7881:7881"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.livekit.rule=Host(`lk.sreevaai.com`)"
      - "traefik.http.routers.livekit.entrypoints=websecure"
      - "traefik.http.routers.livekit.tls=true"
      - "traefik.http.routers.livekit.tls.certresolver=mytlschallenge"
      - "traefik.http.services.livekit.loadbalancer.server.port=7880"

  # Redis (Required by LiveKit)
  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --save 20 1 --loglevel warning --maxmemory-policy noeviction --appendonly yes
    networks:
      - traefik-proxy
    restart: always
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # LiveKit Egress (Requires Redis & LiveKit Server)
  # Config is supplied inline from .env via EGRESS_CONFIG_BODY (no hardcoded secrets, no mounted file).
  # Redis must match the LiveKit server above so egress receives jobs.
  livekit-egress:
    image: livekit/egress:latest
    container_name: livekit-egress
    restart: always
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: "${LIVEKIT_API_KEY}"
        api_secret: "${LIVEKIT_API_SECRET}"
        ws_url: "ws://livekit:7880"
        redis:
          # Internal redis container runs without auth — no username/password.
          address: "redis:6379"
        # This host has 2 CPUs; egress defaults assume 4 and log
        # "not enough cpu for some egress types". Lower the per-job CPU
        # cost so room/track egress is accepted on a 2-CPU box.
        cpu_cost:
          room_composite_cpu_cost: 2.0
          web_cpu_cost: 2.0
          track_composite_cpu_cost: 1.0
          track_cpu_cost: 0.5
    networks:
      - traefik-proxy
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started

networks:
  traefik-proxy:
    external: true

volumes:
  redis-data:
