services:
  # Next.js Frontend + API
  hr-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # NEXT_PUBLIC_LIVEKIT_URL: "wss://new-wi7dgqfb.livekit.cloud" # LiveKit Cloud (commented for now)
        NEXT_PUBLIC_LIVEKIT_URL: "wss://lk.sreevaai.com" # Deployment cloud
        NEXT_PUBLIC_APP_URL: "https://www.sreevaai.com"
    container_name: Frontend
    networks:
      - traefik-proxy
    env_file:
      - .env
    environment:
      LIVEKIT_URL: "wss://lk.sreevaai.com"
      NEXT_PUBLIC_LIVEKIT_URL: "wss://lk.sreevaai.com"
    restart: always
    dns:
      - 8.8.8.8
      - 8.8.4.4
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hr-app.rule=Host(`www.sreevaai.com`) || Host(`sreevaai.com`)"
      - "traefik.http.routers.hr-app.entrypoints=websecure"
      - "traefik.http.routers.hr-app.tls=true"
      - "traefik.http.routers.hr-app.tls.certresolver=mytlschallenge"
      - "traefik.http.services.hr-app.loadbalancer.server.port=3000"
    depends_on:
      - redis

  # Background Worker (Handles Scoring & Emails)
  hr-worker:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: Normal-worker
    command: npm run worker
    env_file:
      - .env
    environment:
      LIVEKIT_URL: "wss://lk.sreevaai.com"
      NEXT_PUBLIC_LIVEKIT_URL: "wss://lk.sreevaai.com"
      WORKER_QUEUES: "resume-processing,invitation-delivery-queue,interview-finalization,interview-snapshots,interview-recording,jd-upload,jd-extraction,backup-queue"
    restart: always
    depends_on:
      - redis
    networks:
      - traefik-proxy
    dns:
      - 8.8.8.8
      - 8.8.4.4

  # Python AI Agent (Backend)
  hr-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: Backend-python-agent
    networks:
      - traefik-proxy
    env_file:
      - .env
    environment:
      LIVEKIT_URL: "wss://lk.sreevaai.com"
    restart: always
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      - redis

  # Python Eval Worker — off-critical-path LLM evaluation (Redis BLPOP)
  eval-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: Eval-worker
    command: python -m interview.eval_worker
    env_file:
      - .env
    environment:
      LIVEKIT_URL: "wss://lk.sreevaai.com"
    restart: always
    depends_on:
      - redis
    networks:
      - traefik-proxy
    dns:
      - 8.8.8.8
      - 8.8.4.4


  # LiveKit Server (Self-Hosted)
  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit
    restart: always
    command: --config /etc/livekit.yaml
    networks:
      - traefik-proxy
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "5000-5100:5000-5100/udp"
      - "7880:7880"
      - "7881:7881"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.livekit.rule=Host(`lk.sreevaai.com`)"
      - "traefik.http.routers.livekit.entrypoints=websecure"
      - "traefik.http.routers.livekit.tls=true"
      - "traefik.http.routers.livekit.tls.certresolver=mytlschallenge"
      - "traefik.http.services.livekit.loadbalancer.server.port=7880"

  # Redis (Required by LiveKit)
  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --save 20 1 --loglevel warning --maxmemory-policy noeviction
    networks:
      - traefik-proxy
    ports:
      - "6379:6379"
    restart: always

  # LiveKit Egress (Requires Redis & LiveKit Server)
  livekit-egress:
    image: livekit/egress:latest
    container_name: livekit-egress
    restart: always
    environment:
      - EGRESS_CONFIG_FILE=/etc/egress.yaml
    volumes:
      - ./egress.yaml:/etc/egress.yaml:ro
    networks:
      - traefik-proxy
    depends_on:
      - redis
      - livekit

networks:
  traefik-proxy:
    external: true
