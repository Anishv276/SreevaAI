services:
  # Next.js Frontend + API
  hr-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_LIVEKIT_URL: "wss://lk.sreevaai.com"
        NEXT_PUBLIC_APP_URL: "https://www.sreevaai.com"
    container_name: hr-frontend
    networks:
      - traefik-proxy
    env_file:
      - .env
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hr-app.rule=Host('www.sreevaai.com') || Host('sreevaai.com')"
      - "traefik.http.routers.hr-app.entrypoints=websecure"
      - "traefik.http.routers.hr-app.tls=true"
      - "traefik.http.routers.hr-app.tls.certresolver=myresolver"
      - "traefik.http.services.hr-app.loadbalancer.server.port=3000"

  # Python AI Agent (Backend)
  hr-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hr-agent
    networks:
      - traefik-proxy
    env_file:
      - .env
    restart: always
    depends_on:
      - livekit
      - redis

  # LiveKit Server (Self-Hosted)
  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit
    restart: always
    command: --config /etc/livekit.yaml
    networks:
      - traefik-proxy
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    ports:
      - "7880:7880"
      - "5000-5100:5000-5100/udp"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.livekit.rule=Host('lk.sreevaai.com')"
      - "traefik.http.routers.livekit.entrypoints=websecure"
      - "traefik.http.routers.livekit.tls=true"
      - "traefik.http.routers.livekit.tls.certresolver=myresolver"
      - "traefik.http.services.livekit.loadbalancer.server.port=7880"

  # Redis (Required by LiveKit)
  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --save 20 1 --loglevel warning
    networks:
      - traefik-proxy
    restart: always

networks:
  traefik-proxy:
    external: true
