name: Deploy LiveKit Agent

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  deploy-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install LiveKit CLI
        env:
          LK_VERSION: "2.17.0"
        run: |
          set -euo pipefail
          cd /tmp
          curl -sSLO "https://github.com/livekit/livekit-cli/releases/download/v${LK_VERSION}/lk_${LK_VERSION}_linux_amd64.tar.gz"
          curl -sSLO "https://github.com/livekit/livekit-cli/releases/download/v${LK_VERSION}/checksums.txt"
          grep " lk_${LK_VERSION}_linux_amd64.tar.gz\$" checksums.txt | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "lk_${LK_VERSION}_linux_amd64.tar.gz" -C "$HOME/.local/bin" lk
          chmod +x "$HOME/.local/bin/lk"

      - name: Deploy Agent to LiveKit Cloud
        env:
          # The CLI will automatically use these to authenticate
          LIVEKIT_URL: wss://interview-system-3bnh6c3s.livekit.cloud
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        working-directory: ./livekit-python-agent
        run: |
          # The CLI installs to ~/.local/bin/lk by default
          export PATH=$PATH:$HOME/.local/bin
          lk agent deploy
