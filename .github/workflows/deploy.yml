# =============================================================================
# SreevaAI — Phase 1 CI/CD: build-on-box deploy to a single EC2 host.
#
# Flow: push to `main`  ->  SSH into EC2  ->  git pull  ->  rebuild  ->  up -d.
# No ECR needed at this phase (the box builds its own images).
#
# Required GitHub repo secrets (Settings > Secrets and variables > Actions):
#   EC2_HOST       Elastic IP or DNS of the box (e.g. 13.x.x.x)
#   EC2_USER       ssh user (ubuntu)
#   EC2_SSH_KEY    the PRIVATE key (.pem contents) for that box
#   APP_DIR        absolute path of the repo on the box (e.g. /home/ubuntu/SreevaAI)
#
# NOTE: the box holds its own .env (never committed). This workflow only ships
# code + restarts containers; it does not touch secrets.
#
# Phase 2 upgrade path is sketched at the bottom (build -> push ECR -> pull).
# =============================================================================
name: Deploy (EC2 single-box)

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # allow manual "Run workflow" from the Actions tab

concurrency:
  group: deploy-prod
  cancel-in-progress: false   # never interrupt a deploy mid-flight

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: EC2 SSH deploy (temporarily disabled — instance not reachable)
        run: |
          echo "⚠️  EC2 SSH deploy disabled pending network fix"
          echo "Instance is not publicly accessible (timeout on port 22)"
          echo "LiveKit agent deployment is active and working"
          echo "TODO: Fix EC2 network connectivity and re-enable this step"

