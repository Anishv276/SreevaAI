# =============================================================================
# SreevaAI — Production stack for a single EC2 box (LiveKit on LiveKit Cloud)
#
# LiveKit server + egress (recording) now run on LiveKit Cloud — NOT on this box.
# This box runs: traefik (TLS) + redis (BullMQ) + app + worker.
# The LiveKit python agent is NOT a container here -- it deploys separately to
# LiveKit Cloud via `lk agent deploy` (see .github/workflows/deploy-agent.yml).
#
# All LiveKit/egress connections go to the Cloud URL from .env:
#   NEXT_PUBLIC_LIVEKIT_URL = wss://<your-project>.livekit.cloud   (browser + server)
#   LIVEKIT_URL             = wss://<your-project>.livekit.cloud   (server/agent + egress API)
#   LIVEKIT_API_KEY / LIVEKIT_API_SECRET = from the LiveKit Cloud dashboard
# The app's egress route (startRoomCompositeEgress) derives the egress host from
# LIVEKIT_URL, so recording is dispatched to Cloud automatically — no container.
#
# AWS security group now only needs:  80/tcp + 443/tcp  (no UDP/7881 — media is on Cloud)
#
# Bring up:  docker compose -f docker-compose.prod.yml up -d --build
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Docker API proxy — Traefik talks to this instead of the real socket.
  # Exposes only the read-only, container-listing calls Traefik's Docker
  # provider needs (CONTAINERS=1); everything else (secrets/env inspection,
  # exec, image build, volume/network admin) is refused. A compromised
  # Traefik container can no longer read other containers' env vars or spin
  # up new (e.g. privileged) containers via the daemon.
  # ---------------------------------------------------------------------------
  socket-proxy:
    # 0.4.2 tag stopped resolving on Docker Hub (2026-07-12) -- pinned to the
    # digest behind :latest at the time instead, same rationale as traefik's pin.
    image: tecnativa/docker-socket-proxy@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476
    container_name: docker-socket-proxy
    restart: always
    environment:
      CONTAINERS: 1
      POST: 0
      SERVICES: 0
      TASKS: 0
      NETWORKS: 0
      VOLUMES: 0
      IMAGES: 0
      INFO: 0
      EXEC: 0
      BUILD: 0
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - docker-proxy
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 50

  # ---------------------------------------------------------------------------
  # Reverse proxy + automatic TLS for www/apex (lk subdomain no longer used)
  # ---------------------------------------------------------------------------
  traefik:
    # v3.7.7 ships a Docker client that negotiates a supported API version
    # against modern daemons (older <=v3.1 hard-coded v1.24 and broke). Pinned
    # instead of :latest so an upstream release can't silently change what
    # ships to prod -- bump deliberately when needed.
    image: traefik:v3.7.7
    container_name: traefik
    restart: always
    command:
      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://socket-proxy:2375"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.mytlschallenge.acme.tlschallenge=true"
      - "--certificatesresolvers.mytlschallenge.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.mytlschallenge.acme.storage=/letsencrypt/acme.json"
    labels:
      # Security response headers, applied to every router that opts in via
      # "traefik.http.routers.<name>.middlewares=security-headers@docker".
      - "traefik.enable=true"
      - "traefik.http.middlewares.security-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.security-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.security-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.security-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.security-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.security-headers.headers.customResponseHeaders.Permissions-Policy=camera=(self), microphone=(self), geolocation=(), interest-cohort=()"
      # 'unsafe-eval' dropped -- not needed by Next.js's own runtime output.
      # 'unsafe-inline' on script-src is kept: Next.js emits inline hydration
      # data/bootstrap scripts without a nonce by default, and removing this
      # without wiring up per-request CSP nonces (next.config headers +
      # middleware) would break page load. Tightening further requires that
      # nonce work, not just deleting the token here.
      # 'wasm-unsafe-eval' added -- MediaPipe FaceLandmarker (HardwareCheck.tsx
      # camera face-detection) compiles/instantiates a WASM module, which needs
      # this directive even with full 'unsafe-eval' dropped. Narrower than
      # 'unsafe-eval': permits WASM compilation only, not eval()/Function() JS
      # injection. Chrome/Edge 87+ only, which HardwareCheck.tsx already requires.
      # media-src added -- interview recording playback (Plyr player) needs its
      # own blank.mp4 poster from cdn.plyr.io plus the actual recording served
      # from the R2 bucket's public dev subdomain; without media-src, default-src
      # 'self' silently blocks both.
      # script-src clarity domain fixed -- the Clarity SDK loads its payload from
      # scripts.clarity.ms (subdomain), not clarity.ms itself.
      - "traefik.http.middlewares.security-headers.headers.customResponseHeaders.Content-Security-Policy=default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://www.googletagmanager.com https://static.cloudflareinsights.com https://www.clarity.ms https://scripts.clarity.ms; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; media-src 'self' https://cdn.plyr.io https://*.r2.dev; connect-src 'self' wss: https:; frame-ancestors 'none'"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "letsencrypt:/letsencrypt"
    depends_on:
      - socket-proxy
    networks:
      - web
      - docker-proxy
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100

  # ---------------------------------------------------------------------------
  # Redis — BullMQ queues (LiveKit/egress no longer use this; they're on Cloud)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.4.7-alpine3.21
    container_name: redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction", "--requirepass", "${REDIS_PASSWORD}"]
    env_file:
      - .env
    volumes:
      - redis-data:/data
    networks:
      - web
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 100

  # ---------------------------------------------------------------------------
  # Next.js app + API
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ..
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL}   # wss://<project>.livekit.cloud
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    image: sreeva-app:latest
    container_name: Frontend
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
      LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL}        # server-side token minting + egress API
      NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      - redis
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hr-app.rule=Host(`www.sreevaai.com`) || Host(`sreevaai.com`)"
      - "traefik.http.routers.hr-app.entrypoints=websecure"
      - "traefik.http.routers.hr-app.tls=true"
      - "traefik.http.routers.hr-app.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.hr-app.middlewares=security-headers@docker"
      - "traefik.http.services.hr-app.loadbalancer.server.port=3000"
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 512

  # ---------------------------------------------------------------------------
  # Background worker — all BullMQ queues
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: ..
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    image: sreeva-app:latest        # same build+tag as hr-frontend -> built once, reused
    container_name: Normal-worker
    restart: always
    command: ["node", "--import", "tsx", "worker.ts"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL}
      NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      WORKER_QUEUES: "resume-processing,invitation-delivery-queue,interview-start,interview-launch-timeout,interview-finalization,interview-snapshots,interview-recording,recording-retention-cleanup,jd-upload,jd-extraction,brief-generation,demo-brief-generation,interview-report"
    depends_on:
      - redis
    networks:
      - web
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 512



networks:
  web:
    driver: bridge
  # Internal-only: carries traffic between traefik and socket-proxy so the
  # real docker.sock is reachable from exactly one container.
  docker-proxy:
    driver: bridge
    internal: true

volumes:
  redis-data:
  letsencrypt:
