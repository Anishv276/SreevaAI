services:
  # Next.js Frontend + API
  frontend:
    build:
      context: ..
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_LIVEKIT_URL: "${NEXT_PUBLIC_LIVEKIT_URL}" # Pulls from .env (e.g. wss://your-project.livekit.cloud)
        NEXT_PUBLIC_APP_URL: "https://www.sreevaai.com"
    container_name: Frontend
    networks:
      - traefik-proxy
    env_file:
      - .env
    environment:
      LIVEKIT_URL: "${LIVEKIT_URL}"
      NEXT_PUBLIC_LIVEKIT_URL: "${NEXT_PUBLIC_LIVEKIT_URL}"
      REDIS_URL: "${REDIS_URL}"
    restart: always
    dns:
      - 8.8.8.8
      - 8.8.4.4
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sreevaai-app.rule=Host(`www.sreevaai.com`) || Host(`sreevaai.com`)"
      - "traefik.http.routers.sreevaai-app.entrypoints=websecure"
      - "traefik.http.routers.sreevaai-app.tls=true"
      - "traefik.http.routers.sreevaai-app.tls.certresolver=mytlschallenge"
      - "traefik.http.services.sreevaai-app.loadbalancer.server.port=3000"

  # Background Worker (Handles Scoring & Emails)
  worker:
    build:
      context: ..
      dockerfile: Dockerfile.frontend
    container_name: Normal-worker
    command: ["npm", "exec", "--", "tsx", "worker.ts"]
    env_file:
      - .env
    environment:
      LIVEKIT_URL: "${LIVEKIT_URL}"
      NEXT_PUBLIC_LIVEKIT_URL: "${NEXT_PUBLIC_LIVEKIT_URL}"
      REDIS_URL: "${REDIS_URL}"
      WORKER_QUEUES: "resume-processing,invitation-delivery-queue,interview-start,interview-finalization,interview-snapshots,interview-recording,recording-retention-cleanup,jd-upload,jd-extraction,backup-queue"
    restart: always
    networks:
      - traefik-proxy
    dns:
      - 8.8.8.8
      - 8.8.4.4



  # Local Redis Database
  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - traefik-proxy

networks:
  traefik-proxy:
    external: true
